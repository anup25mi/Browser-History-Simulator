# Server Port
server.port=8080

# Application Name
spring.application.name=browser-history-simulator

# MySQL Database Configuration
# You can set DB_USERNAME and DB_PASSWORD environment variables, or change root/empty defaults
spring.datasource.url=jdbc:mysql://localhost:3306/browser_history_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Banner Off for Clean Console Output
spring.main.banner-mode=console
